name: Geo sync (catálogo de georreferenciamento)

# Re-gera o catálogo de coordenadas verificadas (data/geo_loc) a partir
# das fontes oficiais (TRE-SC, TSE 2026 do repositório, INEP, OSM) e
# commita as mudanças. O app usa o catálogo na mesma origem do Pages,
# sem processamento no navegador.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1'   # segundas, 06:30 UTC (03:30 Brasília)
  push:
    branches: [main]
    paths:
      - 'sync/geo_ref.py'
      - 'sync/geo_pbf.py'
      - '.github/workflows/geo-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Baixar fontes e gerar catálogo
        run: python3 sync/geo_ref.py --fetch
      - name: Verificar integridade do catálogo
        run: python3 test/geo_ref_check.py
      - name: Commitar catálogo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geo_loc reports/geo_cobertura.json
          if git diff --cached --quiet; then
            echo "Catálogo sem mudanças; nada a commitar."
          else
            git commit -m "chore(geo): atualiza catálogo de georreferenciamento SC 2026 ($(date -u +%Y-%m-%d))"
            git push
          fi
