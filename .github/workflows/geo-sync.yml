name: Geo validation (catálogo de georreferenciamento)

# Validação LEITURA (semanal + manual + push em pipeline/manifesto):
# re-gera o catálogo de coordenadas verificadas (data/geo_loc) a partir
# das fontes oficiais (TSE/INEP/OSM/TRE-SC) + manifesto de revisões
# manuais (sync/geo_overrides.json), valida os dois catálogos (publicado
# e re-gerado) e PUBLICA UM DIFF REPRODUTÍVEL COMO ARTEFATO — sem
# commitar nada.
#
# Política de publicação: mudanças no catálogo geográfico exigem revisão
# humana antes de ir para o branch publicado. Quando as fontes mudam,
# revisar o artefato 'geo-validation' (diff + relatório + resumo) e
# publicar o re-gerado manualmente (via PR). Nenhum commit automático
# neste workflow — por isso permissions: contents: read (e nenhum secret).
# Diff não vazio entre publicado e re-gerado → aviso explícito no log
# (REVISÃO HUMANA exigida antes de publicar).
on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1'   # segundas, 06:30 UTC (03:30 Brasília)
  push:
    branches: [main]
    paths:
      - 'sync/geo_ref.py'
      - 'sync/geo_pbf.py'
      - 'sync/geo_overrides.json'
      - '.github/workflows/geo-sync.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Baixar fontes e re-gerar catálogo (diretório temporário)
        run: |
          python3 sync/geo_ref.py --fetch \
            --out "$RUNNER_TEMP/geo_out" \
            --report "$RUNNER_TEMP/geo_report.json"
      - name: Validar catálogo publicado (data/geo_loc)
        run: python3 test/geo_ref_check.py --no-rebuild
      - name: Validar catálogo re-gerado
        run: python3 test/geo_ref_check.py --out "$RUNNER_TEMP/geo_out" --no-rebuild
      - name: Diff publicado x re-gerado (reprodutível)
        if: always()
        run: |
          {
            echo "## Diff data/geo_loc (publicado) x re-gerado"
            diff -ru data/geo_loc "$RUNNER_TEMP/geo_out" || true
            echo
            echo "## Diff reports/geo_cobertura.json"
            diff -u reports/geo_cobertura.json "$RUNNER_TEMP/geo_report.json" || true
          } > geo_diff.txt
          if [ ! -d "$RUNNER_TEMP/geo_out" ] || [ ! -f "$RUNNER_TEMP/geo_report.json" ]; then
            echo '::warning::Re-geração incompleta (falha em etapa anterior) — REVISÃO HUMANA exigida antes de qualquer publicação.'
          elif ! diff -rq data/geo_loc "$RUNNER_TEMP/geo_out" >/dev/null 2>&1 \
            || ! diff -q reports/geo_cobertura.json "$RUNNER_TEMP/geo_report.json" >/dev/null 2>&1; then
            echo '::notice::Diff NÃO VAZIO entre o catálogo publicado (data/geo_loc) e o re-gerado — REVISÃO HUMANA exigida antes de publicar (artefato geo-validation: diff + relatório + resumo).'
          else
            echo '::notice::Catálogos idênticos (publicado x re-gerado) — nada a revisar.'
          fi
          python3 - "$RUNNER_TEMP/geo_report.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1], encoding='utf-8'))['resumo']
          pub = json.load(open('reports/geo_cobertura.json', encoding='utf-8'))['resumo']
          print('## Resumo re-gerado:', json.dumps({k: r[k] for k in
                ('locais_verificados', 'locais_distintos', 'secoes_verificadas',
                 'secoes_dataset_app', 'secoes_sem_coordenada')}, ensure_ascii=False))
          if r['locais_verificados'] < pub['locais_verificados']:
              print('::warning::Re-geração verificou MENOS locais que o catálogo '
                    'publicado — provável fonte indisponível nesta execução; '
                    'NÃO publicar este re-gerado.')
          PY
      - name: Publicar artefato de validação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-validation
          path: |
            geo_diff.txt
            ${{ runner.temp }}/geo_report.json
